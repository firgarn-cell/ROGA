<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пассажирам.РФ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-radius: 16px;
        }

        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; font-family: 'Inter', sans-serif; color: var(--text-main);
        }

        .mobile-app {
            width: 390px; height: 844px; background-color: var(--bg-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 40px; border: 8px solid #1e293b;
            overflow-y: auto; overflow-x: hidden; position: relative;
            display: flex; flex-direction: column;
        }
        .mobile-app::-webkit-scrollbar { display: none; }

        .header { 
            background: var(--primary-color); color: white; 
            padding: 40px 20px 20px; text-align: center; 
            border-radius: 32px 32px 0 0; position: sticky; top: 0; z-index: 10;
        }
        .header h2 { margin: 0; font-size: 22px; font-weight: 700; }

        .content { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; }

        input, select, textarea {
            width: 100%; padding: 16px; margin-bottom: 20px;
            border: 1px solid #cbd5e1; border-radius: 12px; box-sizing: border-box;
            font-family: 'Inter', sans-serif; font-size: 15px; background: var(--surface-color);
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary-color);
        }

        button { 
            width: 100%; background: var(--primary-color); color: white; 
            border: none; padding: 16px; font-size: 16px; font-weight: 600;
            border-radius: 12px; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .card { 
            background: var(--surface-color); padding: 20px; 
            border-radius: var(--border-radius); margin-bottom: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .card p { margin: 10px 0; font-size: 14px; }

        .status-new { color: #d97706; background: #fef3c7; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block;}
        .status-done { color: #059669; background: #d1fae5; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block;}
        
        a { color: var(--primary-color); font-weight: 600; text-decoration: none; }
        a:hover { color: var(--primary-hover); text-decoration: underline; }

        .errorlist {
            color: #dc2626; background: #fee2e2; padding: 12px 16px;
            border-radius: 8px; font-size: 13px; list-style: none; margin-top: -10px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="mobile-app">
        <div class="header">
            <h2>Пассажирам.РФ</h2>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
