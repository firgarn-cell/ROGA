{% extends 'core/base.html' %}
{% block content %}
    <h3 style="text-align:center;">Авторизация</h3>
    {% if form.errors %}
        <p class="error">Неправильный логин или пароль!</p>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'register' %}" style="text-decoration:none; color:#0056b3;">Еще не зарегистрированы? Регистрация</a>
    </div>
{% endblock %}
